  <rect x="652" y="276" width="170" height="28" rx="8" fill="#FFFFFF" stroke="#8A4B7A" stroke-width="1"/>
  <text x="737" y="294" text-anchor="middle" font-size="12" fill="#1F2328" class="mono">openjiuwen-symphony</text>

