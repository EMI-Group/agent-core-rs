  <rect x="368" y="424" width="174" height="32" rx="8" fill="#FFFFFF" stroke="#9A6B1F" stroke-width="1"/>
  <text x="455" y="444.5" text-anchor="middle" font-size="12.5" fill="#1F2328" class="mono">openjiuwen-context</text>
  <rect x="554" y="424" width="182" height="32" rx="8" fill="#FFFFFF" stroke="#9A6B1F" stroke-width="1"/>
  <text x="645" y="444.5" text-anchor="middle" font-size="12.5" fill="#1F2328" class="mono">openjiuwen-workflow</text>

