  <rect x="196" y="348" width="160" height="32" rx="8" fill="#FFFFFF" stroke="#3F7A46" stroke-width="1"/>
  <text x="276" y="368.5" text-anchor="middle" font-size="12.5" fill="#1F2328" class="mono">openjiuwen-agent</text>
