<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1080 760" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">openJiuwen Rust 工作区分层</title>
  <desc id="fig-desc">Eight horizontal layers of the openJiuwen Rust workspace, from the entry layer at the top to the base layer at the bottom: entry, application and tools, framework and extensions, agent and runtime, orchestration, state and governance, model and tools, and base. Each layer lists its crates. Upward arrows between layers show that upper layers depend on lower ones. A caption notes the 30 crates, the re-export umbrella crates, and the development crates excluded from default-members.</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .mono {
      font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .note {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
  </style>
  <defs>
    <marker id="dep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7B8794"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="1" y="1" width="1078" height="758" rx="14" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>

  <!-- header -->
  <text x="32" y="40" font-size="24" font-weight="700" fill="#111827">openJiuwen Rust 工作区分层</text>
  <text x="32" y="64" font-size="12.5" fill="#57606A">30 个 crate 分为八层；箭头表示依赖方向：上层依赖下层。</text>
  <text x="1048" y="40" text-anchor="end" font-size="12" fill="#8B949E">Rust 2021 · v0.1.0</text>

  <!-- ===== tier 8: entry ===== -->
  <rect x="16" y="84" width="1048" height="56" rx="12" fill="#EAF0F8" stroke="#C6D5E8" stroke-width="1"/>
  <text x="34" y="117" font-size="14" font-weight="600" fill="#33517E">⑧ 入口层</text>
  <rect x="196" y="96" width="104" height="32" rx="8" fill="#FFFFFF" stroke="#33517E" stroke-width="1"/>
  <text x="248" y="116.5" text-anchor="middle" font-size="12.5" fill="#1F2328" class="mono">openjiuwen</text>
  <rect x="312" y="96" width="136" height="32" rx="8" fill="#FFFFFF" stroke="#33517E" stroke-width="1"/>
  <text x="380" y="116.5" text-anchor="middle" font-size="12.5" fill="#1F2328" class="mono">openjiuwen-cli</text>
  <rect x="460" y="96" width="168" height="32" rx="8" fill="#FFFFFF" stroke="#33517E" stroke-width="1"/>
  <text x="544" y="116.5" text-anchor="middle" font-size="12.5" fill="#1F2328" class="mono">openjiuwen-examples</text>
  <rect x="640" y="96" width="130" height="32" rx="8" fill="#FFFFFF" stroke="#33517E" stroke-width="1"/>
  <text x="705" y="116.5" text-anchor="middle" font-size="12.5" fill="#1F2328" class="mono">openjiuwen-e2e</text>
  <rect x="782" y="96" width="200" height="32" rx="8" fill="#FFFFFF" stroke="#33517E" stroke-width="1"/>
  <text x="882" y="116.5" text-anchor="middle" font-size="12.5" fill="#1F2328" class="mono">openjiuwen-test-support</text>

