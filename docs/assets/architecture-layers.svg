  <line x1="632" y1="637" x2="632" y2="624" stroke="#7B8794" stroke-width="1.6" marker-end="url(#dep-arrow)"/>
  <line x1="632" y1="561" x2="632" y2="548" stroke="#7B8794" stroke-width="1.6" marker-end="url(#dep-arrow)"/>
  <line x1="632" y1="485" x2="632" y2="472" stroke="#7B8794" stroke-width="1.6" marker-end="url(#dep-arrow)"/>
  <line x1="632" y1="409" x2="632" y2="396" stroke="#7B8794" stroke-width="1.6" marker-end="url(#dep-arrow)"/>
  <line x1="632" y1="333" x2="632" y2="320" stroke="#7B8794" stroke-width="1.6" marker-end="url(#dep-arrow)"/>
  <line x1="632" y1="233" x2="632" y2="220" stroke="#7B8794" stroke-width="1.6" marker-end="url(#dep-arrow)"/>
  <line x1="632" y1="157" x2="632" y2="144" stroke="#7B8794" stroke-width="1.6" marker-end="url(#dep-arrow)"/>

  <!-- ===== caption ===== -->
  <rect x="16" y="706" width="1048" height="42" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
  <text x="32" y="723" font-size="10.8" fill="#57606A">共 30 个 crate；<tspan class="mono" font-size="10.5">openjiuwen</tspan> 与 <tspan class="mono" font-size="10.5">openjiuwen-core</tspan> 是 re-export umbrella（模块路径保持不变）。</text>
  <text x="32" y="739" font-size="10.8" fill="#57606A"><tspan class="mono" font-size="10.5">openjiuwen-examples</tspan> / <tspan class="mono" font-size="10.5">openjiuwen-e2e</tspan> / <tspan class="mono" font-size="10.5">openjiuwen-test-support</tspan> 不在 default-members 中，裸 <tspan class="mono" font-size="10.5">cargo test</tspan> 不会构建它们。</text>
</svg>
