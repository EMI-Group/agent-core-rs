# Workspace manifest for the Rust rewrite of the openJiuwen agent SDK.
# The Python reference implementation lives in a read-only foreign repository;
# every crate below maps to a top-level Python package or a focused kernel module.
[workspace]
resolver = "2"
members = ["crates/*"]
default-members = [
    "crates/openjiuwen-common",
    "crates/openjiuwen-macros",
    "crates/openjiuwen-foundation",
    "crates/openjiuwen-session",
    "crates/openjiuwen-graph",
    "crates/openjiuwen-workflow",
    "crates/openjiuwen-context",
    "crates/openjiuwen-memory",
    "crates/openjiuwen-retrieval",
    "crates/openjiuwen-sysop",
    "crates/openjiuwen-security",
    "crates/openjiuwen-agent",
    "crates/openjiuwen-multiagent",
    "crates/openjiuwen-runner",
    "crates/openjiuwen-core",
    "crates/openjiuwen-harness-protocol",
    "crates/openjiuwen-harness",
    "crates/openjiuwen-harness-providers",
    "crates/openjiuwen-agent-teams",
    "crates/openjiuwen-extensions",
    "crates/openjiuwen-dev-tools",
    "crates/openjiuwen-symphony",
    "crates/openjiuwen-rsi",
    "crates/openjiuwen-agent-evolving",
    "crates/openjiuwen-auto-harness",
    "crates/openjiuwen",
    "crates/openjiuwen-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/openjiuwen/openjiuwen"
authors = ["openJiuwen contributors"]

[workspace.dependencies]
# --- internal crates -------------------------------------------------------
openjiuwen-common = { path = "crates/openjiuwen-common" }
openjiuwen-macros = { path = "crates/openjiuwen-macros" }
openjiuwen-foundation = { path = "crates/openjiuwen-foundation" }
openjiuwen-session = { path = "crates/openjiuwen-session" }
openjiuwen-graph = { path = "crates/openjiuwen-graph" }
openjiuwen-workflow = { path = "crates/openjiuwen-workflow" }
openjiuwen-context = { path = "crates/openjiuwen-context" }
openjiuwen-memory = { path = "crates/openjiuwen-memory" }
openjiuwen-retrieval = { path = "crates/openjiuwen-retrieval" }
openjiuwen-sysop = { path = "crates/openjiuwen-sysop" }
openjiuwen-security = { path = "crates/openjiuwen-security" }
openjiuwen-agent = { path = "crates/openjiuwen-agent" }
openjiuwen-multiagent = { path = "crates/openjiuwen-multiagent" }
openjiuwen-runner = { path = "crates/openjiuwen-runner" }
openjiuwen-core = { path = "crates/openjiuwen-core" }
openjiuwen-harness-protocol = { path = "crates/openjiuwen-harness-protocol" }
openjiuwen-harness = { path = "crates/openjiuwen-harness" }
openjiuwen-harness-providers = { path = "crates/openjiuwen-harness-providers" }
openjiuwen-agent-teams = { path = "crates/openjiuwen-agent-teams" }
openjiuwen-extensions = { path = "crates/openjiuwen-extensions" }
openjiuwen-dev-tools = { path = "crates/openjiuwen-dev-tools" }
openjiuwen-symphony = { path = "crates/openjiuwen-symphony" }
openjiuwen-rsi = { path = "crates/openjiuwen-rsi" }
openjiuwen-agent-evolving = { path = "crates/openjiuwen-agent-evolving" }
openjiuwen-auto-harness = { path = "crates/openjiuwen-auto-harness" }
openjiuwen = { path = "crates/openjiuwen" }
openjiuwen-test-support = { path = "crates/openjiuwen-test-support" }

# --- async runtime & utilities --------------------------------------------
async-stream = "0.3"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
futures-util = "0.3"
once_cell = "1"
parking_lot = "0.12"
tokio = { version = "1.53", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
    "process",
    "net",
    "signal",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

# --- proc macros -----------------------------------------------------------
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

# --- serialization & schema ------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
schemars = "1"
jsonschema = "0.33"
thiserror = "2"

# --- networking & protocols -----------------------------------------------
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "multipart",
] }
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
http = "1"
url = { version = "2", features = ["serde"] }
rmcp = { version = "0.8", features = [
    "client",
    "server",
    "transport-child-process",
    "transport-sse-client",
    "transport-streamable-http-client",
    "transport-streamable-http-server",
] }

# --- CLI & diagnostics -----------------------------------------------------
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-otlp = "0.31"
anyhow = "1"
dotenvy = "0.15"

# --- data, ids & text ------------------------------------------------------
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
sha2 = "0.10"
base64 = "0.22"
tiktoken-rs = "0.9"
glob = "0.3"
walkdir = "2"
which = "8"
notify = "8"

# --- storage ---------------------------------------------------------------
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "uuid",
] }

# --- testing ---------------------------------------------------------------
tempfile = "3"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
needless_pass_by_value = "warn"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
