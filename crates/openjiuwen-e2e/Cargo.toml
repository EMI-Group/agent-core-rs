[package]
name = "openjiuwen-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# The crate is a scenario harness: its `src/lib.rs` is a marker module and every
# line of behaviour lives in an integration-test binary under `tests/`.
# Dependencies therefore sit here (not under `[dev-dependencies]`) so that the
# `a2a`/`otel` features can enable features of the same crates unambiguously.
[dependencies]
openjiuwen.workspace = true
openjiuwen-harness.workspace = true
openjiuwen-harness-protocol.workspace = true
openjiuwen-harness-providers.workspace = true
openjiuwen-agent-teams.workspace = true
openjiuwen-extensions.workspace = true
openjiuwen-symphony.workspace = true
openjiuwen-rsi.workspace = true
openjiuwen-agent-evolving.workspace = true
openjiuwen-test-support.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[features]
default = []
# Enables the A2A client/server scenario (`tests/a2a_roundtrip.rs`).
a2a = ["openjiuwen/a2a", "openjiuwen-extensions/a2a"]
# Enables the OTLP/HTTP export scenario (`tests/plugin_observability.rs`).
# `openjiuwen-agent-teams/otlp` is what provides the team-memory -> OTel bridge
# (`OtlpMemoryObserver`) that the scenario drives; it pulls the extensions' `otel`
# sink itself, and the explicit `openjiuwen-extensions/otel` keeps
# `openjiuwen/otel`'s kernel trace-sink path in the same unified feature set.
otel = ["openjiuwen/otel", "openjiuwen-extensions/otel", "openjiuwen-agent-teams/otlp"]
# The kernel crates are only reachable through the umbrella, so their SQLite
# backends are enabled through `openjiuwen/sqlite`; `openjiuwen-agent-teams` is
# also a direct dependency (same crate, explicit feature keeps `team_backend.rs`
# independent of how the umbrella forwards).
sqlite = ["openjiuwen/sqlite", "openjiuwen-agent-teams/sqlite"]

[lints]
workspace = true
