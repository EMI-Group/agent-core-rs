[package]
name = "openjiuwen-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# Auto-discovery is off: every runnable example is declared explicitly below so the
# curated set is visible in one place and optional examples can carry
# `required-features`. Adding an example means adding a `[[example]]` entry.
autoexamples = false

[dependencies]
openjiuwen.workspace = true
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
futures.workspace = true
tracing.workspace = true

# Example targets are dev targets, so they may use dev-dependencies. Kept out of
# `[dependencies]` so the library in `src/` cannot reach the test-only crate.
[dev-dependencies]
openjiuwen-test-support.workspace = true
openjiuwen-macros.workspace = true
serde.workspace = true
schemars.workspace = true
async-trait.workspace = true
tempfile.workspace = true
tokio-util.workspace = true
# The umbrella exposes `sqlite` as an opt-in feature that is off by default, so
# the examples that demonstrate a SQLite backend (16 lite memory FTS, 17 team
# persistence, 23 memory dreaming) take the owning crate directly to switch the
# backend feature on. All of them are workspace crates, so the build stays
# offline.
openjiuwen-memory = { workspace = true, features = ["sqlite"] }
openjiuwen-agent-teams = { workspace = true, features = ["sqlite"] }
# Dream ticks take an injected `DateTime<Utc>`, and a `TempDir` alone cannot
# produce one, so example 23 reads the workspace-pinned clock crate.
chrono.workspace = true

[features]
default = []
# Compiles `openjiuwen-extensions/a2a`; example 11 requires it.
a2a = ["openjiuwen/a2a"]
# Marker feature only: MCP support is always compiled in because
# `openjiuwen-foundation` enables its default `mcp` feature, so this adds nothing.
# It exists so the documented gate `--features a2a,mcp` reads naturally.
mcp = []

# --- examples --------------------------------------------------------------
