[package]
name = "openjiuwen-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
openjiuwen-common.workspace = true
openjiuwen-foundation.workspace = true
openjiuwen-session.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
axum.workspace = true
# The mock server owns its accept loop (so it can abort every connection task on
# drop), which needs the same server plumbing `axum::serve` uses internally.
# They are already locked transitively through `axum`, pinned inline like the
# workspace's other `hyper`/`tower` consumers.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tower-service = "0.3"
futures.workspace = true
uuid.workspace = true
chrono.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[features]
default = []

[lints]
workspace = true
