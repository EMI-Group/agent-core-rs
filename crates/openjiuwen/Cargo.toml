[package]
name = "openjiuwen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
openjiuwen-common.workspace = true
openjiuwen-foundation.workspace = true
openjiuwen-session.workspace = true
openjiuwen-graph.workspace = true
openjiuwen-workflow.workspace = true
openjiuwen-context.workspace = true
openjiuwen-memory.workspace = true
openjiuwen-retrieval.workspace = true
openjiuwen-sysop.workspace = true
openjiuwen-security.workspace = true
openjiuwen-agent.workspace = true
openjiuwen-multiagent.workspace = true
openjiuwen-runner.workspace = true
openjiuwen-core.workspace = true
openjiuwen-harness-protocol.workspace = true
openjiuwen-harness.workspace = true
openjiuwen-harness-providers.workspace = true
openjiuwen-agent-teams.workspace = true
openjiuwen-extensions.workspace = true
openjiuwen-dev-tools.workspace = true
openjiuwen-symphony.workspace = true
openjiuwen-rsi.workspace = true
openjiuwen-agent-evolving.workspace = true
openjiuwen-auto-harness.workspace = true

[features]
default = ["native"]
# harness + harness providers
native = ["openjiuwen-harness/native", "openjiuwen-harness-providers/native"]
native-v2 = ["openjiuwen-harness-providers/native-v2"]
vendor = ["openjiuwen-harness-providers/vendor"]
browser = ["openjiuwen-harness/browser"]
cua = ["openjiuwen-harness/cua"]
mobile = ["openjiuwen-harness/mobile"]
notify = ["openjiuwen-harness/notify"]
# storage backends
sqlite = [
    "openjiuwen-foundation/sqlite",
    "openjiuwen-session/sqlite",
    "openjiuwen-memory/sqlite",
    "openjiuwen-extensions/sqlite",
    "openjiuwen-symphony/sqlite",
    "openjiuwen-agent-teams/sqlite",
]
# transports / remote backends
a2a = ["openjiuwen-extensions/a2a"]
mcp = ["openjiuwen-extensions/mcp"]
redis = ["openjiuwen-extensions/redis"]
pulsar = ["openjiuwen-extensions/pulsar"]
distributed = ["openjiuwen-agent-teams/distributed"]
# observability
otel = [
    "openjiuwen-extensions/otel",
    "openjiuwen-core/otel",
    "openjiuwen-session/otel",
    "openjiuwen-agent-teams/otel",
]
# sandbox execution
sandbox = ["openjiuwen-sysop/sandbox"]
# opt-in network/vendor test gates
live-tests = [
    "openjiuwen-foundation/live-tests",
    "openjiuwen-harness/live-tests",
    "openjiuwen-harness-providers/live-tests",
    "openjiuwen-agent-teams/live-tests",
    "openjiuwen-extensions/live-tests",
]

[lints]
workspace = true
