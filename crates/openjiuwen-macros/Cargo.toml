[package]
name = "openjiuwen-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
[lib]
proc-macro = true
[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
[dev-dependencies]
# Generated code targets these crates; the cycle runs through dev-dependencies
# only, so the library build of this crate never pulls them in.
openjiuwen-common.workspace = true
openjiuwen-foundation.workspace = true
async-trait.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Pinned: compile-fail output (`.stderr`) is compiler-version sensitive, so the
# fixture harness version must be deterministic. 1.0.119 matches the workspace
# MSRV (1.85).
trybuild = "=1.0.119"
[features]
default = []
[lints]
workspace = true
