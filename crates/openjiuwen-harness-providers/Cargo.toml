[package]
name = "openjiuwen-harness-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
openjiuwen-harness-protocol.workspace = true
openjiuwen-harness.workspace = true
openjiuwen-common.workspace = true
openjiuwen-agent.workspace = true
openjiuwen-session.workspace = true
# Pulled in only by the `native-v2` feature; its `mcp` default feature comes along.
openjiuwen-agent-teams = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
indexmap.workspace = true
uuid.workspace = true
which.workspace = true

[dev-dependencies]
openjiuwen-test-support.workspace = true
openjiuwen-foundation.workspace = true
tempfile.workspace = true

[features]
default = ["native"]
native = []
vendor = []
# The `native_v2` provider: an in-process harness hosted by `openjiuwen-agent-teams`.
native-v2 = ["dep:openjiuwen-agent-teams"]
live-tests = []

[lints]
workspace = true
