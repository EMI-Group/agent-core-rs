[package]
name = "openjiuwen-foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
openjiuwen-common.workspace = true
openjiuwen-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror = "2"
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
futures.workspace = true
futures-util.workspace = true
async-stream.workspace = true
reqwest.workspace = true
bytes.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
regex.workspace = true
jsonschema.workspace = true
serde_yaml_ng.workspace = true
url.workspace = true
base64.workspace = true
sha2.workspace = true
indexmap.workspace = true
rmcp = { workspace = true, optional = true }
tiktoken-rs = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
# `rediss://` TLS stack. Pinned inline (like `tower`/`hyper` elsewhere) because the
# workspace manifest is outside this crate's authority; both packages are already in
# `Cargo.lock` through `reqwest`, so offline builds resolve them.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
# Advisory cross-process file lock for the OAuth token store (`nix::fcntl::flock`).
nix = { workspace = true }

[dev-dependencies]
wiremock.workspace = true
tempfile.workspace = true

[features]
default = ["mcp", "tiktoken"]
mcp = ["dep:rmcp"]
tiktoken = ["dep:tiktoken-rs"]
sqlite = ["dep:sqlx"]
live-tests = []

[lints]
workspace = true
