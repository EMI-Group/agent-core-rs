[package]
name = "openjiuwen-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
openjiuwen-common.workspace = true
openjiuwen-foundation.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror = "2"
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-stream.workspace = true
uuid.workspace = true
chrono.workspace = true
parking_lot.workspace = true
tracing.workspace = true
sqlx = { workspace = true, optional = true }
# `rediss://` (TLS) for the Redis checkpointer. Pinned inline because the
# workspace manifest has no entry for the TLS stack; `ring` (not aws-lc-rs) is
# the crypto provider, matching the locked dependency set.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
webpki-roots = "1"

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
sqlite = ["dep:sqlx"]
# Empty marker: enables the real trace-sink installation path in `otel` so a
# consumer (e.g. `openjiuwen-extensions`) can wire its OTel sink through it.
otel = []

[lints]
workspace = true
