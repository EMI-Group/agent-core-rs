[package]
name = "openjiuwen-agent-teams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
openjiuwen-harness.workspace = true
openjiuwen-harness-protocol.workspace = true
openjiuwen-core.workspace = true
openjiuwen-common.workspace = true
openjiuwen-foundation.workspace = true
openjiuwen-multiagent.workspace = true
openjiuwen-memory.workspace = true
openjiuwen-session.workspace = true
openjiuwen-agent.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
async-stream.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
parking_lot.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
tempfile.workspace = true
rmcp = { workspace = true, optional = true }
clap.workspace = true
sqlx = { workspace = true, optional = true }
which.workspace = true
openjiuwen-extensions = { workspace = true, optional = true, features = ["otel"] }

[dev-dependencies]
openjiuwen-test-support.workspace = true

[features]
default = ["mcp"]
mcp = ["dep:rmcp"]
distributed = []
sqlite = ["dep:sqlx"]
otel = []
otlp = ["dep:openjiuwen-extensions"]
live-tests = []

[[bin]]
name = "team-member"
path = "src/bin/team-member.rs"

[[bin]]
name = "openjiuwen-team-mcp"
path = "src/bin/openjiuwen-team-mcp.rs"
required-features = ["mcp"]

[lints]
workspace = true
